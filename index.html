<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puppy Math Puzzles 🐾</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
    background: linear-gradient(135deg, #ffe0f0 0%, #e0f0ff 50%, #f0ffe0 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 14px;
    transition: background 1s ease;
  }

  h1 {
    font-size: clamp(1.3rem, 4.5vw, 2rem);
    color: #7c3aed;
    text-shadow: 2px 2px 0 #f9a8d4;
    text-align: center;
    letter-spacing: 1px;
  }

  .dog-banner {
    font-size: clamp(0.85rem, 3vw, 1.1rem);
    color: white;
    background: linear-gradient(135deg, #7c3aed, #ec4899);
    padding: 6px 22px;
    border-radius: 20px;
    box-shadow: 0 3px 10px rgba(124,58,237,0.35);
    text-align: center;
    letter-spacing: 0.5px;
  }

  .score-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.95rem;
    color: #374151;
    background: white;
    padding: 8px 20px;
    border-radius: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    flex-wrap: wrap;
    justify-content: center;
  }
  .score-bar span { font-weight: bold; }
  .pieces-count { color: #7c3aed; font-size: 1.1rem; }
  .streak { color: #f59e0b; }
  .puzzle-num { color: #ec4899; }

  .main-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    max-width: 980px;
  }

  /* ── PUZZLE ── */
  .puzzle-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .puzzle-label {
    font-size: 0.9rem;
    color: #6b7280;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .puzzle-container {
    position: relative;
    width: 500px;
    height: 400px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    border: 4px solid #7c3aed;
    background: #f3f4f6;
    transition: border-color 0.8s ease;
  }
  .dog-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  .puzzle-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(5, 1fr);
  }
  .piece {
    background: #c4b5fd;
    border: 1.5px solid #7c3aed;
    transition: opacity 0.5s ease, transform 0.5s ease;
    position: relative;
    overflow: hidden;
  }
  .piece.revealed { opacity: 0; pointer-events: none; }
  .piece.pop { animation: popOff 0.55s ease forwards; }
  @keyframes popOff {
    0%   { opacity:1; transform:scale(1); }
    50%  { opacity:0.6; transform:scale(1.3) rotate(8deg); }
    100% { opacity:0; transform:scale(0); }
  }
  .piece::after {
    content: '🐾';
    position: absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size: clamp(6px,1.2vw,11px);
    opacity:0.5;
    pointer-events:none;
  }

  /* ── MATH PANEL ── */
  .math-panel {
    background: white;
    border-radius: 20px;
    padding: 22px 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.13);
    border: 3px solid #f9a8d4;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-width: 250px;
    max-width: 310px;
    flex: 1;
  }
  .math-title { font-size:1rem; color:#7c3aed; font-weight:bold; text-align:center; }
  .question-badge {
    font-size: clamp(1.7rem,5.5vw,2.7rem);
    color: #1e293b;
    font-weight: bold;
    text-align: center;
    padding: 14px 22px;
    background: linear-gradient(135deg, #ede9fe, #fce7f3);
    border-radius: 16px;
    letter-spacing: 2px;
    min-width: 175px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.07);
  }
  .answer-row { display:flex; gap:10px; align-items:center; }
  .answer-input {
    width:85px;
    font-size:1.6rem;
    font-family:inherit;
    text-align:center;
    border:3px solid #c4b5fd;
    border-radius:12px;
    padding:7px;
    outline:none;
    transition:border-color 0.2s;
    background:#faf5ff;
  }
  .answer-input:focus { border-color:#7c3aed; }
  .answer-input.wrong { border-color:#ef4444; animation:shake 0.35s; }
  .answer-input.right { border-color:#22c55e; }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }
  .submit-btn {
    font-family:inherit;
    font-size:1rem;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    color:white;
    border:none;
    border-radius:12px;
    padding:10px 18px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 4px 12px rgba(124,58,237,0.35);
    transition:transform 0.1s,box-shadow 0.1s;
    letter-spacing:0.5px;
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(124,58,237,0.45);}
  .submit-btn:active{transform:translateY(0);}
  .feedback{font-size:1rem;font-weight:bold;min-height:26px;text-align:center;}
  .feedback.good{color:#16a34a;}
  .feedback.bad{color:#dc2626;}
  .hint-btn {
    font-family:inherit;font-size:0.8rem;
    background:none;border:2px dashed #c4b5fd;color:#7c3aed;
    border-radius:8px;padding:4px 14px;cursor:pointer;opacity:0.8;
  }
  .hint-btn:hover{opacity:1;background:#faf5ff;}
  .hint-text{font-size:0.82rem;color:#6b7280;min-height:18px;text-align:center;font-style:italic;}
  .progress-wrap{width:100%;}
  .progress-label{font-size:0.78rem;color:#6b7280;margin-bottom:4px;text-align:center;}
  .progress-track{width:100%;height:13px;background:#e9d5ff;border-radius:7px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#a855f7,#ec4899);border-radius:7px;transition:width 0.5s ease;}

  /* ── CELEBRATION ── */
  #celebration{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,0.55);z-index:100;
    justify-content:center;align-items:center;padding:16px;
  }
  #celebration.show{display:flex;}
  .celeb-box{
    background:white;border-radius:24px;padding:36px 30px;
    text-align:center;max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    border:4px solid #f9a8d4;
    animation:bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes bounceIn{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}
  .celeb-box h2{font-size:2rem;color:#7c3aed;margin-bottom:10px;}
  .celeb-box p{font-size:1rem;color:#374151;margin-bottom:6px;line-height:1.5;}
  .celeb-dog{font-size:4.5rem;margin-bottom:6px;}
  .celeb-scores{
    display:flex;gap:16px;justify-content:center;
    margin:12px 0 16px;
  }
  .celeb-score-box{
    background:linear-gradient(135deg,#ede9fe,#fce7f3);
    border-radius:12px;padding:10px 16px;text-align:center;
  }
  .celeb-score-box .val{font-size:1.5rem;font-weight:bold;color:#7c3aed;}
  .celeb-score-box .lbl{font-size:0.75rem;color:#6b7280;}
  .next-teaser{
    font-size:0.9rem;color:#6b7280;
    background:#f9fafb;border-radius:10px;
    padding:8px 14px;margin-bottom:14px;
    border:2px dashed #e5e7eb;
  }
  .next-teaser strong{color:#374151;}
  .next-btn{
    font-family:inherit;font-size:1.1rem;
    background:linear-gradient(135deg,#f59e0b,#ef4444);
    color:white;border:none;border-radius:14px;
    padding:13px 30px;cursor:pointer;font-weight:bold;
    box-shadow:0 6px 18px rgba(239,68,68,0.35);
    letter-spacing:0.5px;transition:transform 0.1s;
  }
  .next-btn:hover{transform:translateY(-2px);}

  .confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:99;}

  @media(max-width:600px){
    .puzzle-container{width:340px;height:272px;}
  }
  @media(max-width:380px){
    .puzzle-container{width:290px;height:232px;}
  }
</style>
</head>

<h1>🐾 Puppy Math Puzzles 🐾</h1>

  <div>⭐ <span id="scoreVal">0</span></div>
  <div>🔥 Streak: <span class="streak" id="streakVal">0</span></div>
</div>

<div class="main-wrap">
  <!-- PUZZLE -->
  <div class="puzzle-section">
    <div class="puzzle-label">🧩 Who's hiding? Solve to find out! 🧩</div>
    <div class="puzzle-container" id="puzzleContainer">
      <svg class="dog-svg" id="dogSvg" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="puzzle-overlay" id="puzzleOverlay"></div>
    </div>
  </div>

  <!-- MATH PANEL -->
  <div class="math-panel">
    <div class="math-title">🧮 Solve to Reveal a Piece!</div>
    <div class="question-badge" id="questionBadge">?</div>
    <div class="answer-row">
      <input class="answer-input" type="number" id="answerInput" placeholder="?" min="0" max="200" autocomplete="off"/>
      <button class="submit-btn" id="submitBtn" onclick="checkAnswer()">✓ GO!</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="hint-btn" onclick="showHint()">💡 Hint</button>
    <div class="hint-text" id="hintText"></div>
    <div class="progress-wrap">
      <div class="progress-label" id="progressLabel">0 of 50 pieces found</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </div>
</div>

<canvas class="confetti-canvas" id="confettiCanvas"></canvas>

<div id="celebration">
  <div class="celeb-box">
    <div class="celeb-dog" id="celebEmoji">🐶</div>
    <h2>🎉 Puzzle Complete! 🎉</h2>
    <p id="celebMsg">You revealed the puppy!</p>
    <div class="celeb-scores">
      <div class="celeb-score-box">
        <div class="val" id="celebPuzzleScore">0</div>
        <div class="lbl">This Puzzle</div>
      </div>
      <div class="celeb-score-box">
        <div class="val" id="celebTotalScore">0</div>
        <div class="lbl">Total ⭐</div>
      </div>
    </div>
    <div class="next-teaser" id="nextTeaser">Next up: ...</div>
    <button class="next-btn" id="nextBtn" onclick="nextPuppy()">🐶 Next Puppy! →</button>
  </div>
</div>

// ═══════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════
const TOTAL_PIECES = 50;
let piecesRevealed = 0;
let score = 0;
let puzzleScore = 0;
let streak = 0;
let puzzleNum = 1;
let dogIndex = 0;
let currentAnswer = 0;
let currentHint = '';
let wrongAttempts = 0;
let usedQuestions = new Set();
let revealQueue = [];

// ═══════════════════════════════════════════
//  DOG LOADING
// ═══════════════════════════════════════════
function loadDog(idx) {
  const dog = DOGS[idx % DOGS.length];
  document.getElementById('dogSvg').innerHTML = dog.svgContent;
  document.getElementById('dogBanner').textContent = `Puzzle #${puzzleNum}: Reveal ${dog.name} the ${dog.breed}!`;
  document.getElementById('puzzleNumDisplay').textContent = puzzleNum;
  document.getElementById('puzzleContainer').style.borderColor = dog.border;
  const [c1, c2, c3] = dog.bgGradient;
  document.body.style.background = `linear-gradient(135deg, ${c1} 0%, ${c2} 50%, ${c3} 100%)`;
}

// ═══════════════════════════════════════════
//  QUESTION GENERATION
// ═══════════════════════════════════════════
function generateQuestion() {
  wrongAttempts = 0;
  let q, a, hint, key;
  const type = Math.random() < 0.5 ? 'mult' : 'sub';
  let attempts = 0;

  do {
    if (type === 'mult') {
      const a1 = Math.floor(Math.random() * 9) + 1;
      const a2 = Math.floor(Math.random() * 9) + 1;
      q = `${a1} × ${a2} = ?`;
      a = a1 * a2;
      hint = `Count by ${a1}'s, ${a2} times`;
      key = `m${a1}x${a2}`;
    } else {
      const minuend = Math.floor(Math.random() * 81) + 10;
      const subtrahend = Math.floor(Math.random() * 9) + 1;
      const result = minuend - subtrahend;
      if (result < 0) { attempts++; continue; }
      q = `${minuend} − ${subtrahend} = ?`;
      a = result;
      hint = `Start at ${minuend}, count back ${subtrahend}`;
      key = `s${minuend}-${subtrahend}`;
    }
    attempts++;
  } while (usedQuestions.has(key) && attempts < 20);

  usedQuestions.add(key);
  if (usedQuestions.size > 70) {
    const [first] = usedQuestions;
    usedQuestions.delete(first);
  }

  currentAnswer = a;
  currentHint = hint;
  document.getElementById('questionBadge').textContent = q;
  document.getElementById('hintText').textContent = '';
  const inp = document.getElementById('answerInput');
  inp.value = '';
  inp.className = 'answer-input';
  setFeedback('', '');
  inp.focus();
}

// ═══════════════════════════════════════════
//  PUZZLE BOARD
// ═══════════════════════════════════════════
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildPuzzle() {
  const overlay = document.getElementById('puzzleOverlay');
  overlay.innerHTML = '';
  for (let i = 0; i < TOTAL_PIECES; i++) {
    const piece = document.createElement('div');
    piece.className = 'piece';
    piece.id = `piece-${i}`;
    piece.style.background = '#c4b5fd';
    overlay.appendChild(piece);
  }
  revealQueue = shuffleArray(Array.from({length: TOTAL_PIECES}, (_, i) => i));
}

function updatePieceColor() {
  const dog = DOGS[dogIndex % DOGS.length];
  // Tint pieces to match dog theme
  const tints = {
    '#7c3aed': '#c4b5fd',
    '#d97706': '#fde68a',
    '#1e293b': '#cbd5e1',
    '#ea580c': '#fdba74',
    '#3b82f6': '#bfdbfe',
  };
  const color = tints[dog.border] || '#c4b5fd';
  document.querySelectorAll('.piece').forEach(p => {
    if (!p.classList.contains('revealed')) p.style.background = color;
  });
}

function revealNextPiece() {
  if (revealQueue.length === 0) return;
  const idx = revealQueue.pop();
  const piece = document.getElementById(`piece-${idx}`);
  if (piece) {
    piece.classList.add('pop');
    setTimeout(() => piece.classList.add('revealed'), 550);
  }
  piecesRevealed++;
  puzzleScore += 10 + (streak >= 3 ? Math.floor(streak / 3) * 5 : 0);
  score = puzzleScore + previousTotal;
  updateUI();
  if (piecesRevealed >= TOTAL_PIECES) {
    setTimeout(showCelebration, 750);
  }
}

// ═══════════════════════════════════════════
//  CHECK ANSWER
// ═══════════════════════════════════════════
function checkAnswer() {
  const inp = document.getElementById('answerInput');
  const val = parseInt(inp.value, 10);

  if (isNaN(val)) {
    setFeedback('Type a number first! 🤔', 'bad');
    inp.classList.add('wrong');
    setTimeout(() => inp.classList.remove('wrong'), 500);
    return;
  }

  if (val === currentAnswer) {
    streak++;
    let msg = '✅ Correct! ';
    if (streak >= 5) msg += `🔥 HOT STREAK x${streak}!`;
    else if (streak >= 3) msg += `⭐ Streak x${streak}!`;
    else msg += '+10 pts!';
    setFeedback(msg, 'good');
    inp.className = 'answer-input right';
    revealNextPiece();
    setTimeout(() => {
      inp.className = 'answer-input';
      generateQuestion();
    }, 750);
  } else {
    wrongAttempts++;
    streak = 0;
    setFeedback(`❌ Not quite! Try again!`, 'bad');
    inp.className = 'answer-input wrong';
    setTimeout(() => inp.classList.remove('wrong'), 400);
    if (wrongAttempts >= 2) {
      document.getElementById('hintText').textContent = '💡 ' + currentHint;
    }
    inp.value = '';
  }

  updateUI();
}

function showHint() {
  document.getElementById('hintText').textContent = '💡 ' + currentHint;
}

function setFeedback(msg, type) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback ' + type;
}

let previousTotal = 0;

function updateUI() {
  document.getElementById('piecesCount').textContent = `${piecesRevealed} / ${TOTAL_PIECES}`;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('streakVal').textContent = streak;
  const pct = (piecesRevealed / TOTAL_PIECES) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${piecesRevealed} of ${TOTAL_PIECES} pieces found`;
}

// ═══════════════════════════════════════════
//  CELEBRATION
// ═══════════════════════════════════════════
function showCelebration() {
  const dog = DOGS[dogIndex % DOGS.length];
  const nextDog = DOGS[(dogIndex + 1) % DOGS.length];

  document.getElementById('celebEmoji').textContent = dog.emoji;
  document.getElementById('celebMsg').textContent =
    `You revealed ${dog.name} the ${dog.breed}! 🎉`;
  document.getElementById('celebPuzzleScore').textContent = puzzleScore;
  document.getElementById('celebTotalScore').textContent = score;

  const isWrapping = (dogIndex + 1) % DOGS.length === 0 && dogIndex + 1 >= DOGS.length;
  document.getElementById('nextTeaser').innerHTML =
    `Next up: <strong>${nextDog.name} the ${nextDog.breed}!</strong> ${nextDog.emoji}`;
  document.getElementById('nextBtn').textContent = '🐶 Next Puppy! →';

  document.getElementById('celebration').classList.add('show');
  launchConfetti();
}

function nextPuppy() {
  previousTotal = score;
  puzzleScore = 0;
  dogIndex = (dogIndex + 1) % DOGS.length;
  puzzleNum++;
  piecesRevealed = 0;
  streak = 0;

  document.getElementById('celebration').classList.remove('show');
  stopConfetti();

  loadDog(dogIndex);
  buildPuzzle();
  updatePieceColor();
  updateUI();
  generateQuestion();
}

// ═══════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════
const CONFETTI_COLORS = ['#f87171','#fb923c','#fbbf24','#4ade80','#60a5fa','#a78bfa','#f472b6','#34d399'];
let confettiParticles = [];
let confettiAF = null;

function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  confettiParticles = [];
  for (let i = 0; i < 180; i++) {
    confettiParticles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 11 + 6,
      h: Math.random() * 6 + 4,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      vx: (Math.random() - 0.5) * 3.5,
      vy: Math.random() * 4 + 2,
      angle: Math.random() * 360,
      spin: (Math.random() - 0.5) * 7,
    });
  }
  stopConfetti();
  animateConfetti();
}

function animateConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confettiParticles.forEach(p => {
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    ctx.rotate(p.angle * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
    p.x += p.vx; p.y += p.vy; p.angle += p.spin;
    if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
  });
  confettiAF = requestAnimationFrame(animateConfetti);
}

function stopConfetti() {
  if (confettiAF) { cancelAnimationFrame(confettiAF); confettiAF = null; }
  const canvas = document.getElementById('confettiCanvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('answerInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkAnswer();
  });
  previousTotal = 0;
  loadDog(dogIndex);
  buildPuzzle();
  updatePieceColor();
  generateQuestion();
});
</script>
