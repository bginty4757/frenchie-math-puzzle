<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frenchie Math Puzzle 🐾</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
    background: linear-gradient(135deg, #ffe0f0 0%, #e0f0ff 50%, #f0ffe0 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 16px;
  }

  h1 {
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    color: #7c3aed;
    text-shadow: 2px 2px 0 #f9a8d4;
    text-align: center;
    letter-spacing: 1px;
  }

  .score-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 1rem;
    color: #374151;
    background: white;
    padding: 8px 20px;
    border-radius: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    flex-wrap: wrap;
    justify-content: center;
  }

  .score-bar span { font-weight: bold; }
  .pieces-count { color: #7c3aed; font-size: 1.15rem; }
  .streak { color: #f59e0b; }

  /* ── MAIN LAYOUT ── */
  .main-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    max-width: 960px;
  }

  /* ── PUZZLE BOARD ── */
  .puzzle-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .puzzle-label {
    font-size: 0.95rem;
    color: #6b7280;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .puzzle-container {
    position: relative;
    width: 500px;
    height: 400px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    border: 4px solid #7c3aed;
    background: #f3f4f6;
  }

  /* SVG dog fills the full container */
  .dog-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* Puzzle overlay */
  .puzzle-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(5, 1fr);
  }

  .piece {
    background: #c4b5fd;
    border: 1.5px solid #7c3aed;
    transition: opacity 0.6s ease, transform 0.6s ease;
    position: relative;
    overflow: hidden;
    cursor: default;
  }

  .piece.revealed {
    opacity: 0;
    pointer-events: none;
  }

  .piece.pop {
    animation: popOff 0.6s ease forwards;
  }

  @keyframes popOff {
    0%   { opacity: 1; transform: scale(1); }
    50%  { opacity: 0.6; transform: scale(1.3) rotate(8deg); }
    100% { opacity: 0; transform: scale(0); }
  }

  /* Paw print on each covered piece */
  .piece::after {
    content: '🐾';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-size: clamp(6px, 1.2vw, 12px);
    opacity: 0.5;
    pointer-events: none;
  }

  /* ── MATH PANEL ── */
  .math-panel {
    background: white;
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.13);
    border: 3px solid #f9a8d4;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    min-width: 260px;
    max-width: 320px;
    flex: 1;
  }

  .math-title {
    font-size: 1.1rem;
    color: #7c3aed;
    font-weight: bold;
    text-align: center;
  }

  .question-badge {
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    color: #1e293b;
    font-weight: bold;
    text-align: center;
    padding: 16px 24px;
    background: linear-gradient(135deg, #ede9fe, #fce7f3);
    border-radius: 16px;
    letter-spacing: 2px;
    min-width: 180px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.07);
  }

  .answer-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .answer-input {
    width: 90px;
    font-size: 1.7rem;
    font-family: inherit;
    text-align: center;
    border: 3px solid #c4b5fd;
    border-radius: 12px;
    padding: 8px;
    outline: none;
    transition: border-color 0.2s;
    background: #faf5ff;
  }
  .answer-input:focus { border-color: #7c3aed; }
  .answer-input.wrong { border-color: #ef4444; animation: shake 0.35s; }
  .answer-input.right { border-color: #22c55e; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-6px); }
    80%      { transform: translateX(6px); }
  }

  .submit-btn {
    font-family: inherit;
    font-size: 1.1rem;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 22px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 12px rgba(124,58,237,0.35);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.5px;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(124,58,237,0.45); }
  .submit-btn:active { transform: translateY(0); }

  .feedback {
    font-size: 1.05rem;
    font-weight: bold;
    min-height: 28px;
    text-align: center;
    transition: opacity 0.3s;
  }
  .feedback.good { color: #16a34a; }
  .feedback.bad  { color: #dc2626; }

  .hint-btn {
    font-family: inherit;
    font-size: 0.82rem;
    background: none;
    border: 2px dashed #c4b5fd;
    color: #7c3aed;
    border-radius: 8px;
    padding: 4px 14px;
    cursor: pointer;
    opacity: 0.8;
  }
  .hint-btn:hover { opacity: 1; background: #faf5ff; }

  .hint-text {
    font-size: 0.85rem;
    color: #6b7280;
    min-height: 20px;
    text-align: center;
    font-style: italic;
  }

  /* Progress bar */
  .progress-wrap {
    width: 100%;
  }
  .progress-label {
    font-size: 0.8rem;
    color: #6b7280;
    margin-bottom: 4px;
    text-align: center;
  }
  .progress-track {
    width: 100%;
    height: 14px;
    background: #e9d5ff;
    border-radius: 7px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #a855f7, #ec4899);
    border-radius: 7px;
    transition: width 0.5s ease;
  }

  /* ── CELEBRATION ── */
  #celebration {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  #celebration.show { display: flex; }

  .celeb-box {
    background: white;
    border-radius: 24px;
    padding: 40px 36px;
    text-align: center;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    border: 4px solid #f9a8d4;
    animation: bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes bounceIn {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .celeb-box h2 { font-size: 2.2rem; color: #7c3aed; margin-bottom: 12px; }
  .celeb-box p  { font-size: 1.1rem; color: #374151; margin-bottom: 20px; line-height: 1.5; }
  .celeb-dog    { font-size: 5rem; margin-bottom: 8px; }
  .play-again-btn {
    font-family: inherit;
    font-size: 1.2rem;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 14px 36px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 6px 18px rgba(239,68,68,0.35);
    letter-spacing: 0.5px;
    transition: transform 0.1s;
  }
  .play-again-btn:hover { transform: translateY(-2px); }

  .confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
  }

  @media (max-width: 600px) {
    .puzzle-container { width: 340px; height: 272px; }
  }
  @media (max-width: 380px) {
    .puzzle-container { width: 290px; height: 232px; }
  }
</style>

<script>
// ─────────────────────────────────────────────
//  GAME STATE
// ─────────────────────────────────────────────
const TOTAL_PIECES = 50;
let piecesRevealed = 0;
let score = 0;
let streak = 0;
let currentAnswer = 0;
let currentQuestion = '';
let currentHint = '';
let wrongAttempts = 0;
let usedQuestions = new Set();

// ─────────────────────────────────────────────
//  QUESTION GENERATION
// ─────────────────────────────────────────────
function generateQuestion() {
  wrongAttempts = 0;
  let q, a, hint;
  let key;

  // Alternate between multiplication and subtraction, weighted slightly toward variety
  const type = Math.random() < 0.5 ? 'mult' : 'sub';

  // Try to pick a question we haven't used recently (up to 20 attempts)
  let attempts = 0;
  do {
    if (type === 'mult') {
      const a1 = Math.floor(Math.random() * 9) + 1; // 1-9
      const a2 = Math.floor(Math.random() * 9) + 1; // 1-9
      q = `${a1} × ${a2} = ?`;
      a = a1 * a2;
      hint = `Count by ${a1}'s, ${a2} times`;
      key = `m${a1}x${a2}`;
    } else {
      const minuend = Math.floor(Math.random() * 81) + 10; // 10-90 (double digit)
      const subtrahend = Math.floor(Math.random() * 9) + 1; // 1-9
      const result = minuend - subtrahend;
      if (result < 0) { attempts++; continue; }
      q = `${minuend} − ${subtrahend} = ?`;
      a = result;
      hint = `Start at ${minuend}, count back ${subtrahend}`;
      key = `s${minuend}-${subtrahend}`;
    }
    attempts++;
  } while (usedQuestions.has(key) && attempts < 20);

  usedQuestions.add(key);
  // Keep the set from growing too large
  if (usedQuestions.size > 60) {
    const [first] = usedQuestions;
    usedQuestions.delete(first);
  }

  currentQuestion = q;
  currentAnswer = a;
  currentHint = hint;
  currentHint = hint;

  document.getElementById('questionBadge').textContent = q;
  document.getElementById('hintText').textContent = '';
  const inp = document.getElementById('answerInput');
  inp.value = '';
  inp.className = 'answer-input';
  inp.focus();
  setFeedback('', '');
}

// ─────────────────────────────────────────────
//  PUZZLE BOARD SETUP
// ─────────────────────────────────────────────
const pieceOrder = Array.from({length: TOTAL_PIECES}, (_, i) => i);

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let revealQueue = [];

function buildPuzzle() {
  const overlay = document.getElementById('puzzleOverlay');
  overlay.innerHTML = '';
  for (let i = 0; i < TOTAL_PIECES; i++) {
    const piece = document.createElement('div');
    piece.className = 'piece';
    piece.id = `piece-${i}`;
    overlay.appendChild(piece);
  }
  revealQueue = shuffleArray([...pieceOrder]);
}

function revealNextPiece() {
  if (revealQueue.length === 0) return;
  const idx = revealQueue.pop();
  const piece = document.getElementById(`piece-${idx}`);
  if (piece) {
    piece.classList.add('pop');
    setTimeout(() => piece.classList.add('revealed'), 600);
  }
  piecesRevealed++;
  updateUI();
  if (piecesRevealed >= TOTAL_PIECES) {
    setTimeout(showCelebration, 700);
  }
}

// ─────────────────────────────────────────────
//  CHECK ANSWER
// ─────────────────────────────────────────────
function checkAnswer() {
  const inp = document.getElementById('answerInput');
  const val = parseInt(inp.value, 10);

  if (isNaN(val)) {
    setFeedback('Type a number first! 🤔', 'bad');
    inp.classList.add('wrong');
    setTimeout(() => inp.classList.remove('wrong'), 500);
    return;
  }

  if (val === currentAnswer) {
    // Correct!
    streak++;
    const bonus = streak >= 3 ? Math.floor(streak / 3) : 0;
    score += 10 + bonus * 5;

    let msg = '✅ Correct! ';
    if (streak >= 5) msg += '🔥 HOT STREAK! +' + (10 + bonus * 5) + ' pts!';
    else if (streak >= 3) msg += '⭐ Nice streak! +' + (10 + bonus * 5) + ' pts!';
    else msg += '+10 pts!';

    setFeedback(msg, 'good');
    inp.className = 'answer-input right';
    revealNextPiece();
    setTimeout(() => {
      inp.className = 'answer-input';
      generateQuestion();
    }, 800);
  } else {
    // Wrong
    wrongAttempts++;
    streak = 0;
    setFeedback(`❌ Try again! (Attempt ${wrongAttempts})`, 'bad');
    inp.className = 'answer-input wrong';
    setTimeout(() => inp.classList.remove('wrong'), 400);
    if (wrongAttempts >= 2) {
      document.getElementById('hintText').textContent = '💡 ' + currentHint;
    }
    inp.value = '';
  }

  updateUI();
}

function showHint() {
  document.getElementById('hintText').textContent = '💡 ' + currentHint;
}

function setFeedback(msg, type) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback ' + type;
}

function updateUI() {
  document.getElementById('piecesCount').textContent = `${piecesRevealed} / ${TOTAL_PIECES}`;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('streakVal').textContent = streak;
  const pct = (piecesRevealed / TOTAL_PIECES) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${piecesRevealed} of ${TOTAL_PIECES} pieces found`;
}

// ─────────────────────────────────────────────
//  CELEBRATION + CONFETTI
// ─────────────────────────────────────────────
function showCelebration() {
  document.getElementById('finalScore').textContent = score;
  document.getElementById('celebration').classList.add('show');
  launchConfetti();
}

// Simple confetti engine
const confettiColors = ['#f87171','#fb923c','#fbbf24','#4ade80','#60a5fa','#a78bfa','#f472b6'];
let confettiParticles = [];
let confettiAF = null;

function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  confettiParticles = [];
  for (let i = 0; i < 160; i++) {
    confettiParticles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 6,
      h: Math.random() * 5 + 4,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 4 + 2,
      angle: Math.random() * 360,
      spin: (Math.random() - 0.5) * 6,
    });
  }
  if (confettiAF) cancelAnimationFrame(confettiAF);
  animateConfetti();
}

function animateConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confettiParticles.forEach(p => {
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    ctx.rotate(p.angle * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
    p.x += p.vx;
    p.y += p.vy;
    p.angle += p.spin;
    if (p.y > canvas.height) {
      p.y = -20;
      p.x = Math.random() * canvas.width;
    }
  });
  confettiAF = requestAnimationFrame(animateConfetti);
}

// ─────────────────────────────────────────────
//  RESET
// ─────────────────────────────────────────────
function resetGame() {
  piecesRevealed = 0;
  score = 0;
  streak = 0;
  usedQuestions.clear();

  document.getElementById('celebration').classList.remove('show');
  if (confettiAF) { cancelAnimationFrame(confettiAF); confettiAF = null; }
  const canvas = document.getElementById('confettiCanvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

  updateUI();
  buildPuzzle();
  generateQuestion();
}

// ─────────────────────────────────────────────
//  KEYBOARD ENTER TO SUBMIT
// ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('answerInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkAnswer();
  });
  buildPuzzle();
  generateQuestion();
});
</script>
